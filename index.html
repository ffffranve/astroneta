<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astroneta</title>
<meta name="description" content="Astroneta: elige un planeta y sobrevive un año. El juego sale el 10 de noviembre de 2026.">
<meta property="og:title" content="Juega Astroneta">
<meta property="og:description" content="Elige un planeta. Sobrevive un año. Sale el 10/11/2026.">
<meta property="og:image" content="https://astroneta.netlify.app/og.jpg">
<meta property="og:url" content="https://astroneta.netlify.app/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#07060f">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #07060f;
    --texto: #e6e2f2;
    --tenue: #a8a0c8;
    --celeste: #cfe8ff;
    --oro: #e0a040;
    --rojo: #ff5a3a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--fondo); color: var(--texto); min-height: 100%; }
  body {
    font-family: "Pixelify Sans", monospace;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
    overflow-x: hidden;
  }
  /* Cielo: estrellas en un canvas de baja resolución, nebulosa y barrido como en los videos. */
  #cielo {
    position: fixed; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; z-index: -2;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60% 45% at 20% 25%, rgba(90, 40, 140, .35), transparent 70%),
      radial-gradient(55% 40% at 85% 75%, rgba(20, 90, 120, .30), transparent 70%),
      repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 2px, transparent 2px 5px);
  }
  main { width: 100%; max-width: 560px; text-align: center; }
  .logo {
    width: min(260px, 62vw); aspect-ratio: 1; border-radius: 50%;
    border: 6px solid var(--oro); display: block; margin: 0 auto 28px;
    box-shadow: 0 0 40px rgba(224,160,64,.25);
    animation: flota 6s ease-in-out infinite;
  }
  @keyframes flota { 50% { transform: translateY(-8px); } }
  .juega { font-size: clamp(28px, 7vw, 44px); font-weight: 700; letter-spacing: .04em; }
  .marca { font-size: clamp(48px, 13.5vw, 92px); font-weight: 700; line-height: 1; margin-bottom: 18px; }
  .juega, .marca {
    background: linear-gradient(#fff4dc, #ffd08a 55%, #ff8a4a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(5px 5px 0 rgba(0,0,0,.85));
  }
  .aviso { font-size: clamp(20px, 5vw, 26px); color: var(--celeste); margin-bottom: 6px; }
  .sub { color: var(--tenue); font-size: 17px; margin-bottom: 28px; }
  .fecha-tit { color: var(--tenue); font-size: 15px; letter-spacing: .2em; text-transform: uppercase; }
  .fecha { font-size: clamp(40px, 11vw, 64px); font-weight: 700; color: #fff; margin: 4px 0 18px;
    text-shadow: 4px 4px 0 rgba(0,0,0,.85); }
  .cuenta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 30px; }
  .cuenta div {
    background: rgba(255,255,255,.05); border: 2px solid rgba(207,232,255,.18);
    padding: 12px 4px 8px;
  }
  .cuenta b { display: block; font-size: clamp(28px, 8vw, 40px); font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .cuenta span { font-size: 12px; color: var(--tenue); letter-spacing: .12em; }
  .cuenta.ya b { color: var(--rojo); }
  .lema { font-size: 19px; margin-bottom: 20px; }
  .boton {
    display: inline-block; font: inherit; font-size: 18px; font-weight: 700; text-decoration: none;
    color: #1a0e08; background: #ffd08a; padding: 14px 22px;
    box-shadow: 4px 4px 0 #7a3a10; border: 2px solid #fff4dc;
  }
  .boton:hover { background: #ffe0a8; }
  .boton:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #7a3a10; }
  footer { margin-top: 34px; font-size: 13px; color: var(--tenue); }
</style>
</head>
<body>
<canvas id="cielo"></canvas>
<main>
  <img class="logo" src="logo.png" alt="Logo de Astroneta: casco de astronauta con un planeta en el visor">
  <div class="juega">JUEGA</div>
  <h1 class="marca">ASTRONETA</h1>

  <p class="aviso">Todavía no se puede jugar.</p>
  <p class="sub">Estamos terminando los planetas.</p>

  <p class="fecha-tit">El juego sale el</p>
  <p class="fecha">10/11/2026</p>

  <div class="cuenta" id="cuenta" aria-live="polite">
    <div><b id="d">--</b><span>DÍAS</span></div>
    <div><b id="h">--</b><span>HORAS</span></div>
    <div><b id="m">--</b><span>MIN</span></div>
    <div><b id="s">--</b><span>SEG</span></div>
  </div>

  <p class="lema">Elige un planeta. Sobrevive un año.</p>
  <a class="boton" href="https://www.youtube.com/channel/UChxPvYqZ32Zzng42nmeBAsQ" target="_blank" rel="noopener">VER LOS PLANETAS EN YOUTUBE</a>

  <footer>Astroneta · 2026</footer>
</main>
<script>
  // Cuenta atrás hasta el lanzamiento (medianoche en España).
  const LANZAMIENTO = new Date("2026-11-10T00:00:00+01:00").getTime();
  const dos = (n) => String(n).padStart(2, "0");
  function tic() {
    const r = Math.max(0, LANZAMIENTO - Date.now());
    const s = Math.floor(r / 1000);
    document.getElementById("d").textContent = dos(Math.floor(s / 86400));
    document.getElementById("h").textContent = dos(Math.floor(s / 3600) % 24);
    document.getElementById("m").textContent = dos(Math.floor(s / 60) % 60);
    document.getElementById("s").textContent = dos(s % 60);
    if (r === 0) document.getElementById("cuenta").classList.add("ya");
  }
  tic(); setInterval(tic, 1000);

  // Estrellas pixeladas que titilan: se dibujan a 1/3 de resolución y se escalan sin suavizar.
  const cv = document.getElementById("cielo"), ctx = cv.getContext("2d");
  let estrellas = [];
  function medir() {
    cv.width = Math.ceil(innerWidth / 3); cv.height = Math.ceil(innerHeight / 3);
    let s = 7; const r = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    estrellas = Array.from({ length: Math.round(cv.width * cv.height / 90) }, () => ({
      x: Math.floor(r() * cv.width), y: Math.floor(r() * cv.height),
      f: r() * 6.28, v: .5 + r() * 2, c: r() < .15 ? "255,200,170" : r() < .3 ? "190,215,255" : "255,255,255",
      g: r() < .04,
    }));
  }
  function dibujar(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const e of estrellas) {
      const a = .35 + .65 * (.5 + .5 * Math.sin(e.f + t / 1000 * e.v));
      ctx.fillStyle = `rgba(${e.c},${a.toFixed(2)})`;
      ctx.fillRect(e.x, e.y, 1, 1);
      if (e.g) { ctx.fillRect(e.x - 1, e.y, 3, 1); ctx.fillRect(e.x, e.y - 1, 1, 3); }
    }
    requestAnimationFrame(dibujar);
  }
  medir(); addEventListener("resize", medir); requestAnimationFrame(dibujar);
</script>
</body>
</html>
